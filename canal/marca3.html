<!doctype html><html><head><meta charset="utf-8">
<style>@font-face{font-family:'Fredoka';font-weight:700;src:url('../organos/node_modules/@fontsource/fredoka/files/fredoka-latin-700-normal.woff2') format('woff2');}body{margin:0}</style></head>
<body><canvas id="logo" width="800" height="800"></canvas><canvas id="banner" width="2560" height="1440"></canvas>
<script>
const TAU = Math.PI * 2, INK = '#24104a';
const SRC = { k: 'kurioso_c.png', tierra: 'planeta_c.png', cel: 'celular_c.png', cohete: 'cohete_c.png', ping: 'pinguino_c.png', arbol: 'arbolito_c.png' };
const IM = {};
const ready = Promise.all(Object.entries(SRC).map(([k, s]) => new Promise(r => { const i = new Image(); i.onload = () => { IM[k] = i; r(); }; i.src = s; })));
const PAL = [['#fff27a', '#ffb31a'], ['#ffb27a', '#ff5a1f'], ['#ff9ac4', '#ff2d78'], ['#d6a8ff', '#8a3dff'], ['#9ee4ff', '#1f9bff'], ['#a6ffb8', '#18c46a'], ['#fff27a', '#ffb31a']];
// Letras 3D de colores, cada una con su propio giro y rebote
function wordmark(g, text, cx, cy, size, o = {}) {
  g.save(); g.font = `700 ${size}px Fredoka`; g.textBaseline = 'middle'; g.textAlign = 'left'; g.lineJoin = 'round';
  const sp = size * (o.spacing ?? -0.02), ws = [...text].map(c => g.measureText(c).width);
  const total = ws.reduce((a, b) => a + b, 0) + sp * (text.length - 1);
  let x = cx - total / 2; const depth = Math.round(size * 0.11);
  [...text].forEach((ch, i) => {
    const w = ws[i], lx = x + w / 2, ly = cy + Math.sin(i * 1.3 + 0.5) * size * 0.06, rot = (i % 2 ? 1 : -1) * 0.07;
    g.save(); g.translate(lx, ly); g.rotate(rot);
    const pal = o.pal ? o.pal[i % o.pal.length] : PAL[i % PAL.length];
    // extrusión 3D
    for (let d = depth; d > 0; d--) { g.fillStyle = d === depth ? INK : '#3d1a78'; g.strokeStyle = INK; g.lineWidth = size * 0.2; g.strokeText(ch, -w / 2 + d * 0.5, d); g.fillText(ch, -w / 2 + d * 0.5, d); }
    g.lineWidth = size * 0.2; g.strokeStyle = INK; g.strokeText(ch, -w / 2, 0);
    const gr = g.createLinearGradient(0, -size * 0.45, 0, size * 0.4); gr.addColorStop(0, pal[0]); gr.addColorStop(1, pal[1]);
    g.fillStyle = gr; g.fillText(ch, -w / 2, 0);
    // brillo
    g.save(); g.beginPath(); g.rect(-w, -size, w * 2, size * 0.62); g.clip(); g.globalAlpha = 0.35; g.fillStyle = '#ffffff'; g.fillText(ch, -w / 2 - 1, -3); g.restore();
    g.restore();
    x += w + sp;
  });
  g.restore(); return total;
}
function cinta(g, text, cx, cy, size, rot) {
  g.save(); g.translate(cx, cy); g.rotate(rot); g.font = `700 ${size}px Fredoka`; g.textAlign = 'center'; g.textBaseline = 'middle';
  const w = g.measureText(text).width + size * 1.1, h = size * 1.25;
  for (const s of [-1, 1]) { g.beginPath(); g.moveTo(s * w / 2, -h * 0.3); g.lineTo(s * (w / 2 + h * 0.55), -h * 0.3); g.lineTo(s * (w / 2 + h * 0.35), h * 0.15); g.lineTo(s * (w / 2 + h * 0.55), h * 0.6); g.lineTo(s * w / 2, h * 0.6); g.closePath(); g.fillStyle = '#c4224f'; g.fill(); g.lineWidth = size * 0.12; g.strokeStyle = INK; g.lineJoin = 'round'; g.stroke(); }
  g.beginPath(); g.roundRect(-w / 2, -h / 2, w, h, h * 0.25); g.fillStyle = '#ff3d6e'; g.fill(); g.lineWidth = size * 0.14; g.strokeStyle = INK; g.stroke();
  g.fillStyle = 'rgba(255,255,255,0.25)'; g.beginPath(); g.roundRect(-w / 2 + 8, -h / 2 + 6, w - 16, h * 0.35, h * 0.15); g.fill();
  g.lineWidth = size * 0.16; g.strokeStyle = INK; g.strokeText(text, 0, 2); g.fillStyle = '#fff'; g.fillText(text, 0, 2);
  g.restore();
}
function rayos(g, cx, cy, n, R, col) { g.save(); g.translate(cx, cy); for (let k = 0; k < n; k++) { if (k % 2) continue; g.fillStyle = col; g.beginPath(); g.moveTo(0, 0); g.arc(0, 0, R, k / n * TAU, (k + 1) / n * TAU); g.closePath(); g.fill(); } g.restore(); }
function estrella(g, x, y, r, col, rot) { g.save(); g.translate(x, y); g.rotate(rot || 0); g.beginPath(); for (let j = 0; j < 10; j++) { const a = j / 10 * TAU - Math.PI / 2, rr = j % 2 ? r * 0.45 : r; g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } g.closePath(); g.fillStyle = col; g.fill(); g.lineWidth = r * 0.18; g.strokeStyle = INK; g.lineJoin = 'round'; g.stroke(); g.restore(); }
function destello(g, x, y, r) { g.save(); g.translate(x, y); g.fillStyle = '#fff'; g.beginPath(); for (let j = 0; j < 8; j++) { const a = j / 8 * TAU, rr = j % 2 ? r * 0.25 : r; g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } g.closePath(); g.fill(); g.restore(); }
function pj(g, k, x, y, h, rot, flip) { const i = IM[k], s = h / i.height; g.save(); g.translate(x, y); g.rotate(rot || 0); g.scale(s * (flip ? -1 : 1), s); g.shadowColor = 'rgba(30,0,60,0.35)'; g.shadowBlur = 25; g.shadowOffsetY = 10; g.drawImage(i, -i.width / 2, -i.height); g.restore(); }
function nube(g, x, y, s) { g.save(); g.translate(x, y); g.scale(s, s); g.fillStyle = 'rgba(255,255,255,0.85)'; for (const [cx, cy, r] of [[0, 0, 60], [60, -25, 70], [130, 0, 55], [65, 20, 60]]) { g.beginPath(); g.arc(cx, cy, r, 0, TAU); g.fill(); } g.restore(); }
window.dibujar = async () => {
  await Promise.all([ready, document.fonts.load('700 100px Fredoka')]);
  // ================= LOGO 800x800 =================
  let g = document.getElementById('logo').getContext('2d');
  let gr = g.createRadialGradient(400, 330, 30, 400, 400, 560); gr.addColorStop(0, '#7b4dff'); gr.addColorStop(0.6, '#4a1fc2'); gr.addColorStop(1, '#250a6e');
  g.fillStyle = gr; g.fillRect(0, 0, 800, 800);
  rayos(g, 400, 330, 32, 700, 'rgba(255,255,255,0.08)');
  gr = g.createRadialGradient(400, 300, 10, 400, 300, 300); gr.addColorStop(0, 'rgba(255,220,120,0.55)'); gr.addColorStop(1, 'rgba(255,220,120,0)'); g.fillStyle = gr; g.fillRect(0, 0, 800, 800);
  // anillo de puntitos
  pj(g, 'k', 400, 560, 470, -0.04);
  cinta(g, 'SOY', 400, 545, 58, -0.05);
  wordmark(g, 'KURIOSO', 400, 650, 128);
  // ================= BANNER 2560x1440 =================
  g = document.getElementById('banner').getContext('2d');
  gr = g.createLinearGradient(0, 0, 0, 1440); gr.addColorStop(0, '#5fd3f5'); gr.addColorStop(0.55, '#a68bff'); gr.addColorStop(1, '#ff8ac0');
  g.fillStyle = gr; g.fillRect(0, 0, 2560, 1440);
  rayos(g, 1280, 720, 40, 2200, 'rgba(255,255,255,0.10)');
  gr = g.createRadialGradient(1280, 700, 50, 1280, 700, 800); gr.addColorStop(0, 'rgba(255,240,170,0.65)'); gr.addColorStop(1, 'rgba(255,240,170,0)'); g.fillStyle = gr; g.fillRect(0, 0, 2560, 1440);
  nube(g, 150, 260, 1.3); nube(g, 2150, 220, 1.5); nube(g, 260, 1250, 1.6); nube(g, 2050, 1280, 1.4); nube(g, 1100, 180, 0.9); nube(g, 1500, 1300, 1.1);
  for (let k = 0; k < 26; k++) { const x = (k * 397) % 2560, y = (k * 233) % 1440; if (x > 470 && x < 2090 && y > 480 && y < 960) continue; estrella(g, x, y, 14 + (k % 4) * 8, ['#ffd23f', '#ffffff', '#4ff0ff', '#ff5e9a'][k % 4], k); }
  // personajes de temas variados (los de los bordes se ven en pantallas grandes)
  pj(g, 'cohete', 330, 560, 520, -0.25);
  pj(g, 'arbol', 2300, 1300, 470, 0.05);
  pj(g, 'ping', 300, 1330, 430, 0.04);
  pj(g, 'cel', 2260, 640, 440, 0.12);
  // zona segura (507..2053 x 508..931)
  pj(g, 'k', 760, 940, 440, -0.06);
  pj(g, 'tierra', 1840, 930, 400, 0.06);
  cinta(g, 'SOY', 1290, 600, 66, -0.05);
  wordmark(g, 'KURIOSO', 1290, 760, 200);
  return [document.getElementById('logo').toDataURL('image/png'), document.getElementById('banner').toDataURL('image/png')];
};
</script></body></html>
