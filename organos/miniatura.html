<!doctype html><html><head><meta charset="utf-8">
<style>@font-face{font-family:'Fredoka';font-weight:700;src:url('node_modules/@fontsource/fredoka/files/fredoka-latin-700-normal.woff2') format('woff2');}html,body{margin:0;background:#000}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="timeline.js"></script><script src="core.js"></script><script src="personajes_img.js"></script>
<script>
const bgIm = new Image(); bgIm.src = 'img/bg_higado.png';
function texto(txt, x, y, size, fill, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot || 0);
  ctx.font = `700 ${size}px Fredoka`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.lineWidth = size * 0.26; ctx.strokeStyle = '#1a0d14'; ctx.strokeText(txt, 0, 8);
  ctx.lineWidth = size * 0.2; ctx.strokeText(txt, 0, 0);
  ctx.fillStyle = fill; ctx.fillText(txt, 0, 0);
  ctx.restore();
}
window.dibujar = async () => {
  await Promise.all([imgsReady, document.fonts.load('700 100px Fredoka'), new Promise(r => bgIm.complete ? r() : bgIm.onload = r)]);
  ctx.drawImage(bgIm, -200, -60, 2400, 1350);
  // rayos de color detrás
  ctx.save(); ctx.translate(560, 620); for (let k = 0; k < 28; k++) { ctx.rotate(TAU / 28); if (k % 2) { ctx.fillStyle = 'rgba(255,200,80,0.22)'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(1800, -150); ctx.lineTo(1800, 150); ctx.fill(); } } ctx.restore();
  let g = ctx.createRadialGradient(560, 600, 200, 960, 540, 1300); g.addColorStop(0, 'rgba(255,170,60,0.25)'); g.addColorStop(1, 'rgba(40,0,20,0.55)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // Hígado grande, asustado y sudando
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; glow(ctx, 560, 640, 620, '255,90,40', 0.35); ctx.restore();
  drawChar('higado', 560, 1450, 1250, 0, { noMouth: true, noShadow: true, rot: -0.04 });
  // boca grande de susto
  ctx.save(); ctx.translate(506, 905); ctx.rotate(-0.04);
  ctx.beginPath(); ctx.ellipse(0, 0, 70, 82, 0, 0, TAU); ctx.fillStyle = '#3d0f1c'; ctx.fill();
  ctx.save(); ctx.clip(); ctx.fillStyle = '#fff'; ctx.fillRect(-80, -90, 160, 34); ctx.fillStyle = '#e8687c'; ctx.beginPath(); ctx.ellipse(0, 62, 48, 34, 0, 0, TAU); ctx.fill(); ctx.restore();
  ctx.lineWidth = 12; ctx.strokeStyle = '#1a0d14'; ctx.stroke(); ctx.restore();
  // gotas de sudor grandes
  for (const [x, y, s] of [[930, 300, 1.4], [980, 420, 1], [180, 380, 1.1]]) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.beginPath(); ctx.moveTo(0, -40); ctx.quadraticCurveTo(28, 5, 0, 22); ctx.quadraticCurveTo(-28, 5, 0, -40); ctx.fillStyle = '#7fd0ff'; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = '#1a0d14'; ctx.stroke(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(-7, -2, 6, 9, 0, 0, TAU); ctx.fill(); ctx.restore(); }
  // Eti pícaro a la derecha
  drawChar('eti', 1520, 1120, 760, 0, { noMouth: true, noShadow: true, rot: 0.08 });
  // sonrisa pícara
  ctx.save(); ctx.translate(1545, 843); ctx.rotate(0.08);
  ctx.beginPath(); ctx.moveTo(-75, -12); ctx.quadraticCurveTo(0, 20, 75, -22); ctx.quadraticCurveTo(10, 95, -75, -12); ctx.closePath();
  ctx.fillStyle = '#3d0f1c'; ctx.fill(); ctx.save(); ctx.clip(); ctx.fillStyle = '#fff'; ctx.fillRect(-80, -30, 160, 30); ctx.fillStyle = '#e8687c'; ctx.beginPath(); ctx.ellipse(0, 55, 40, 22, 0, 0, TAU); ctx.fill(); ctx.restore();
  ctx.lineWidth = 10; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1a0d14'; ctx.stroke(); ctx.restore();
  // texto
  texto('1 TRAGO', 1360, 170, 190, '#ffffff', -0.05);
  texto('= 1 HORA', 1380, 360, 170, '#ffd23f', -0.05);
  // flecha roja hacia el hígado
  ctx.save(); ctx.translate(1010, 560); ctx.rotate(2.6);
  ctx.beginPath(); ctx.moveTo(0, -38); ctx.lineTo(170, -38); ctx.lineTo(170, -85); ctx.lineTo(270, 0); ctx.lineTo(170, 85); ctx.lineTo(170, 38); ctx.lineTo(0, 38); ctx.closePath();
  ctx.fillStyle = '#ff2d3d'; ctx.fill(); ctx.lineWidth = 14; ctx.strokeStyle = '#1a0d14'; ctx.stroke(); ctx.restore();
  return document.getElementById('c').toDataURL('image/png');
};
</script></body></html>
